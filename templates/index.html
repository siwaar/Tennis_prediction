<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <title>Tennis Winner Predictor</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<style> 
  ::placeholder { /* Firefox, Chrome, Opera */ 
      color: white; 
  } 
  </style> 

<body style="background-image: url('../static/images/tennis.jpg');">

 <div class="login"; overflow-y:auto;>
	<h1>Tennis Winner Predictor</h1>
     <!-- Main Input For Receiving Query to our ML -->
    <form action="{{ url_for('predict_interface') }}" method="post">
      <input type="number" step=0.01 name="tourney_id" value="{{ request.form['tourney_id'] }}"  placeholder="tourney_id" required="required" />  
      <input type="number" step=0.01 name="tourney_date" value="{{ request.form['tourney_date'] }}"  placeholder="tourney_date" required="required" /> 
      <input type="number" step=0.01 name="best_of" value="{{ request.form['best_of'] }}"  placeholder="best_of" required="required" />
      <input type="number" step=0.01 name="match_num" value="{{ request.form['match_num'] }}" placeholder="match_num" required="required" />
      <input type="number" step=0.01 name="round" value="{{ request.form['round'] }}" placeholder="round" required="required" />
      <input type="number" step=0.01 name="surface" value="{{ request.form['surface'] }}" placeholder="surface" required="required" />
      <input type="number" step=0.01 name="tourney_level" value="{{ request.form['tourney_level'] }}" placeholder="tourney_level" required="no" />
      <input type="number" step=0.01 name="p1_age" value="{{ request.form['p1_age'] }}" placeholder="p1_age" required="required" />
      <input type="number" step=0.01 name="p1_hand" value="{{ request.form['p1_hand'] }}" placeholder="p1_hand" required="no" />
      <input type="number" step=0.01 name="p1_ht" value="{{ request.form['p1_ht'] }}" placeholder="p1_ht" required="required" />
      <input type="number" step=0.01 name="p1_id" value="{{ request.form['p1_id'] }}" placeholder="p1_id" required="required" />
      <input type="number" step=0.01 name="p1_ioc" value="{{ request.form['p1_ioc'] }}" placeholder="p1_ioc" required="required" />
      <input type="number" step=0.01 name="p1_rank" value="{{ request.form['p1_rank'] }}" placeholder="p1_rank" required="required" />
      <input type="number" step=0.01 name="p1_rank_points" value="{{ request.form['p1_rank_points'] }}" placeholder="p1_rank_points" required="required" />
      <input type="number" step=0.01 name="p1_seed" value="{{ request.form['p1_seed'] }}" placeholder="p1_seed" required="required" />
      <input type="number" step=0.01 name="p2_age" value="{{ request.form['p2_age'] }}" placeholder="p2_age" required="required" />
      <input type="number" step=0.01 name="p2_hand" value="{{ request.form['p2_hand'] }}" placeholder="p2_hand" required="no" />
      <input type="number" step=0.01 name="p2_ht" value="{{ request.form['p2_ht'] }}" placeholder="p2_ht" required="required" />
      <input type="number" step=0.01 name="p2_id" value="{{ request.form['p2_id'] }}" placeholder="p2_id" required="required" />
      <input type="number" step=0.01 name="p2_ioc" value="{{ request.form['p2_ioc'] }}" placeholder="p2_ioc" required="required" />
      <input type="number" step=0.01 name="p2_rank" value="{{ request.form['p2_rank'] }}" placeholder="p2_rank" required="required" />
      <input type="number" step=0.01 name="p2_rank_points" value="{{ request.form['p2_rank_points'] }}" placeholder="p2_rank_points" required="required" />
      <input type="number" step=0.01 name="p2_seed" value="{{ request.form['p2_seed'] }}" placeholder="p2_seed" required="required" />
    <button type="submit" class="btn btn-primary btn-block btn-large">Predict Winner</button>
    </form>

   <br>
   <br>
   <h4 style="color:#ffffff">
    {{result}}
    </h4>
 </div>
</body>
</html>
